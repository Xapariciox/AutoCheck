# AutoCheck · entorno local
#
#   Todo en Docker:            docker compose up -d --build
#   Backend desde IntelliJ:    docker compose up -d db
#                              (y arranca AutocheckApplication con el perfil "dev")
#
# Los valores salen del .env de la raíz (copia .env.example).
name: autocheck

services:
  db:
    image: postgres:16
    container_name: autocheck-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-autocheck}
      POSTGRES_USER: ${DB_USER:-autocheck}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-autocheck}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data              # persistencia de los datos
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: autocheck-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # Dentro de la red de Docker la BD se llama "db", no "localhost"
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-autocheck}
      DB_USER: ${DB_USER:-autocheck}
      DB_PASSWORD: ${DB_PASSWORD:-autocheck}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

volumes:
  pgdata:
