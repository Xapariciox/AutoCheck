# Perfil de desarrollo local. Activar con: -Dspring-boot.run.profiles=dev
# Los valores por defecto coinciden con el PostgreSQL local de Docker.
spring:
  # Lee el .env de la raíz si arrancas desde backend/ (mvnw) o desde la raíz (IntelliJ).
  # Las variables de entorno reales (p. ej. las de docker-compose) tienen prioridad.
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/autocheck}
    username: ${DB_USER:autocheck}
    password: ${DB_PASSWORD:autocheck}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.autocheck: DEBUG
